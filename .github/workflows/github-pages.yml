name: Deploy static preview to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".img-scan/**"
      - "scripts/build-static-preview.py"
      - "wordpress/wp-content/themes/cyma-prod-v2/assets/css/**"
      - "wordpress/wp-content/themes/cyma-prod-v2/assets/js/**"
      - "wordpress/wp-content/themes/cyma-prod-v2/assets/images/**"
      - "wordpress/wp-content/themes/cyma-prod-v2/assets/videos/**"
      - ".github/workflows/github-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build static preview
        run: python3 scripts/build-static-preview.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
